<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100" role="img" aria-labelledby="t">
<title id="t">La Concha, San Sebastián / Donostia: a ilha de Santa Clara entre os montes Igueldo e Urgull, vista da balaustrada do passeio</title>
<!-- Paisagem original e esquemática, desenhada à mão para o Habla. Não reproduz fotografia nem traçado de terceiros.
     Ponto de vista: o Paseo de La Concha olhando para o mar (norte). Igueldo à esquerda (pôr do sol), Urgull à direita,
     Santa Clara ao centro, praia em arco e a grade do passeio, símbolos indicados pela prefeitura de Donostia.
     A Catedral del Buen Pastor fica atrás de quem olha nesta vista e por isso não aparece. -->
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#1a0e06"/></linearGradient>
 <radialGradient id="sun" cx="80" cy="52" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".34"/><stop offset=".5" stop-color="#ff7a1a" stop-opacity=".08"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1714"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
 <radialGradient id="lamp" cx="404" cy="38" r="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".32"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
 <pattern id="grade" x="0" y="84.6" width="9.6" height="12.4" patternUnits="userSpaceOnUse"><circle cx="4.8" cy="6.2" r="4.1" fill="none" stroke="#cbc5bb" stroke-width="1"/><circle cx="4.8" cy="6.2" r="1.1" fill="#cbc5bb"/><path d="M0 1.2v1.6M0 9.6v1.6" stroke="#cbc5bb" stroke-width="1"/></pattern>
</defs>
<rect width="480" height="100" fill="url(#sky)"/>
<rect width="480" height="100" fill="url(#sun)"/>
<rect y="54" width="480" height="46" fill="url(#sea)"/>
<g fill="none" stroke="#ff7a1a" stroke-linecap="round" stroke-opacity=".38" stroke-width="1"><path d="M70 63h48M86 67h26M62 71h30M104 71h12M78 75h22"/></g>
<!-- Igueldo, com o torreão no alto -->
<path d="M0 26C14 24 30 22 44 23C62 24 78 30 96 40C112 49 128 55 150 59V62H0Z" fill="#2a2724"/>
<path d="M40 23v-7h1.4v-1.5h1.4v1.5h1.4v-1.5h1.4v1.5h1.4V23Z" fill="#2a2724"/>
<path d="M0 26C14 24 30 22 44 23C62 24 78 30 96 40C112 49 128 55 150 59" fill="none" stroke="#ff7a1a" stroke-opacity=".72" stroke-width="1.2"/>
