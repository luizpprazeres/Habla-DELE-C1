<path d="M204 61C210 58 214 52 222 47C230 42.5 240 41.5 250 42.5C258 43.5 264 48 268 53C271 57 274 59.5 278 61Z" fill="#2a2724"/>
<path d="M204 61C210 58 214 52 222 47C230 42.5 240 41.5 250 42.5C258 43.5 264 48 268 53C271 57 274 59.5 278 61" fill="none" stroke="#ff7a1a" stroke-opacity=".72" stroke-width="1.2"/>
